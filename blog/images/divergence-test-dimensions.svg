<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <style>
      .dim-label { font-size: 13px; font-weight: 600; fill: #1a1a2e; }
      .test-count { font-size: 12px; fill: #4a5568; }
      .test-name { font-size: 10px; fill: #718096; }
      .header { font-size: 16px; font-weight: 700; fill: #1a1a2e; }
      .subheader { font-size: 11px; fill: #718096; }
    </style>
  </defs>

  <!-- Header -->
  <text x="400" y="30" text-anchor="middle" class="header">Cognitive Pipeline Divergence Coverage</text>
  <text x="400" y="48" text-anchor="middle" class="subheader">48 capabilities audited · 43 tests · 7 dimensions · 0 mocks</text>

  <!-- Derivation -->
  <rect x="20" y="70" width="240" height="150" rx="8" fill="#EBF5FB" stroke="#2980B9" stroke-width="1.5"/>
  <text x="140" y="92" text-anchor="middle" class="dim-label">Derivation</text>
  <text x="140" y="108" text-anchor="middle" class="test-count">9 tests · DerivationDivergenceTest</text>
  <text x="30" y="126" class="test-name">mood baseline PAD</text>
  <text x="30" y="140" class="test-name">coping defaults (4 dimensions)</text>
  <text x="30" y="154" class="test-name">regulation weights</text>
  <text x="30" y="168" class="test-name">CBR strategy · social cognition</text>
  <text x="30" y="182" class="test-name">habituation · capacity · expression</text>
  <text x="30" y="196" class="test-name">recurring thought thresholds</text>

  <!-- Appraisal -->
  <rect x="280" y="70" width="240" height="150" rx="8" fill="#FEF9E7" stroke="#F39C12" stroke-width="1.5"/>
  <text x="400" y="92" text-anchor="middle" class="dim-label">Appraisal / Tick</text>
  <text x="400" y="108" text-anchor="middle" class="test-count">8 tests · AppraisalDivergenceTest</text>
  <text x="290" y="126" class="test-name">appraisal weights · emotion mapping</text>
  <text x="290" y="140" class="test-name">drive composition (curiosity)</text>
  <text x="290" y="154" class="test-name">behavioral attractors (CAPS)</text>
  <text x="290" y="168" class="test-name">search budgets (4 dimensions)</text>
  <text x="290" y="182" class="test-name">curiosity channel (I-type/D-type)</text>
  <text x="290" y="196" class="test-name">tick-level SEC + action tendencies</text>

  <!-- Consolidation -->
  <rect x="540" y="70" width="240" height="150" rx="8" fill="#F5EEF8" stroke="#8E44AD" stroke-width="1.5"/>
  <text x="660" y="92" text-anchor="middle" class="dim-label">Consolidation</text>
  <text x="660" y="108" text-anchor="middle" class="test-count">6 tests · ConsolidationDivergenceTest</text>
  <text x="550" y="126" class="test-name">behavioral attractors (CAPS settle)</text>
  <text x="550" y="140" class="test-name">drive classification (CBR mode)</text>
  <text x="550" y="154" class="test-name">experience graduation thresholds</text>
  <text x="550" y="168" class="test-name">belief revision (inference style)</text>
  <text x="550" y="182" class="test-name">goal prioritization (extraction bias)</text>
  <text x="550" y="196" class="test-name">CAPS input activations (trace)</text>

  <!-- Prompt Rendering -->
  <rect x="20" y="240" width="240" height="160" rx="8" fill="#EAFAF1" stroke="#27AE60" stroke-width="1.5"/>
  <text x="140" y="262" text-anchor="middle" class="dim-label">Prompt Rendering</text>
  <text x="140" y="278" text-anchor="middle" class="test-count">8 tests · PromptSectionDivergenceTest</text>
  <text x="30" y="296" class="test-name">full prompt composite</text>
  <text x="30" y="310" class="test-name">behavioral · drive · mood sections</text>
  <text x="30" y="324" class="test-name">curiosity · attention sections</text>
  <text x="30" y="338" class="test-name">shadow archetype · needs pyramid</text>

  <!-- Theory of Mind -->
  <rect x="280" y="240" width="240" height="160" rx="8" fill="#FDEDEC" stroke="#E74C3C" stroke-width="1.5"/>
  <text x="400" y="262" text-anchor="middle" class="dim-label">Theory of Mind</text>
  <text x="400" y="278" text-anchor="middle" class="test-count">8 tests · ToM + Bridge Divergence</text>
  <text x="290" y="296" class="test-name">trust formation · suspiciousness</text>
  <text x="290" y="310" class="test-name">relational biasing · channel weights</text>
  <text x="290" y="324" class="test-name">Bayesian posterior (ambiguous threat)</text>
  <text x="290" y="338" class="test-name">cooperative approach · distress inference</text>
  <text x="290" y="352" class="test-name">dominance-approach attribution</text>

  <!-- Emotion Regulation -->
  <rect x="540" y="240" width="240" height="160" rx="8" fill="#FDF2E9" stroke="#E67E22" stroke-width="1.5"/>
  <text x="660" y="262" text-anchor="middle" class="dim-label">Emotion Regulation</text>
  <text x="660" y="278" text-anchor="middle" class="test-count">4 tests · EmotionRegulationDivergenceTest</text>
  <text x="550" y="296" class="test-name">regulation strategy (reappraisal)</text>
  <text x="550" y="310" class="test-name">coping strategy (confrontation)</text>
  <text x="550" y="324" class="test-name">displacement accumulation</text>
  <text x="550" y="338" class="test-name">mode detection sensitivity</text>

  <!-- Flow arrows -->
  <line x1="260" y1="145" x2="280" y2="145" stroke="#CBD5E0" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="520" y1="145" x2="540" y2="145" stroke="#CBD5E0" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="140" y1="220" x2="140" y2="240" stroke="#CBD5E0" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="400" y1="220" x2="400" y2="240" stroke="#CBD5E0" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="660" y1="220" x2="660" y2="240" stroke="#CBD5E0" stroke-width="1.5" marker-end="url(#arrow)"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#CBD5E0"/>
    </marker>
  </defs>
</svg>
