<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" font-family="system-ui, -apple-system, sans-serif">
  <!-- Title -->
  <text x="400" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a1a">EMA Coping Strategy Taxonomy</text>
  <text x="400" y="46" text-anchor="middle" font-size="11" fill="#64748b">Organized by mental representation targeted (Marsella &amp; Gratch 2009)</text>

  <!-- Attention column -->
  <rect x="20" y="70" width="175" height="340" rx="8" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="107" y="92" text-anchor="middle" font-size="13" font-weight="700" fill="#854d0e">ATTENTION</text>
  <text x="107" y="107" text-anchor="middle" font-size="9" fill="#a16207">What to monitor</text>

  <rect x="32" y="122" width="151" height="38" rx="5" fill="#fef9c3" stroke="#eab308" stroke-width="1"/>
  <text x="107" y="140" text-anchor="middle" font-size="10" font-weight="600" fill="#713f12">Seek information</text>
  <text x="107" y="153" text-anchor="middle" font-size="8" fill="#92400e">focus on uncertain state</text>

  <rect x="32" y="170" width="151" height="38" rx="5" fill="#fef9c3" stroke="#eab308" stroke-width="1"/>
  <text x="107" y="188" text-anchor="middle" font-size="10" font-weight="600" fill="#713f12">Suppress information</text>
  <text x="107" y="201" text-anchor="middle" font-size="8" fill="#92400e">stop monitoring</text>

  <!-- Belief column -->
  <rect x="210" y="70" width="175" height="340" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="297" y="92" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b">BELIEF</text>
  <text x="297" y="107" text-anchor="middle" font-size="9" fill="#b91c1c">What is true</text>

  <rect x="222" y="122" width="151" height="38" rx="5" fill="#fee2e2" stroke="#f87171" stroke-width="1"/>
  <text x="297" y="140" text-anchor="middle" font-size="10" font-weight="600" fill="#7f1d1d">Shift responsibility</text>
  <text x="297" y="153" text-anchor="middle" font-size="8" fill="#991b1b">reframe attribution</text>

  <rect x="222" y="170" width="151" height="38" rx="5" fill="#fee2e2" stroke="#f87171" stroke-width="1"/>
  <text x="297" y="188" text-anchor="middle" font-size="10" font-weight="600" fill="#7f1d1d">Wishful thinking</text>
  <text x="297" y="201" text-anchor="middle" font-size="8" fill="#991b1b">alter perceived likelihood</text>

  <rect x="222" y="218" width="151" height="38" rx="5" fill="#fee2e2" stroke="#f87171" stroke-width="1"/>
  <text x="297" y="236" text-anchor="middle" font-size="10" font-weight="600" fill="#7f1d1d">Denial</text>
  <text x="297" y="249" text-anchor="middle" font-size="8" fill="#991b1b">refuse to acknowledge</text>

  <!-- Desire column -->
  <rect x="400" y="70" width="175" height="340" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="487" y="92" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">DESIRE</text>
  <text x="487" y="107" text-anchor="middle" font-size="9" fill="#1d4ed8">What matters</text>

  <rect x="412" y="122" width="151" height="38" rx="5" fill="#dbeafe" stroke="#60a5fa" stroke-width="1"/>
  <text x="487" y="140" text-anchor="middle" font-size="10" font-weight="600" fill="#1e3a8a">Mental disengagement</text>
  <text x="487" y="153" text-anchor="middle" font-size="8" fill="#1d4ed8">reduce drive intensity</text>

  <rect x="412" y="170" width="151" height="38" rx="5" fill="#dbeafe" stroke="#60a5fa" stroke-width="1"/>
  <text x="487" y="185" text-anchor="middle" font-size="10" font-weight="600" fill="#1e3a8a">Positive</text>
  <text x="487" y="196" text-anchor="middle" font-size="10" font-weight="600" fill="#1e3a8a">reinterpretation</text>
  <text x="487" y="208" text-anchor="middle" font-size="8" fill="#1d4ed8">highlight positive aspects</text>

  <rect x="412" y="218" width="151" height="38" rx="5" fill="#dbeafe" stroke="#60a5fa" stroke-width="1"/>
  <text x="487" y="236" text-anchor="middle" font-size="10" font-weight="600" fill="#1e3a8a">Acceptance</text>
  <text x="487" y="249" text-anchor="middle" font-size="8" fill="#1d4ed8">reduce importance + settle</text>

  <!-- Intention column -->
  <rect x="590" y="70" width="190" height="340" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="685" y="92" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">INTENTION</text>
  <text x="685" y="107" text-anchor="middle" font-size="9" fill="#166534">What to do</text>

  <rect x="602" y="122" width="166" height="30" rx="5" fill="#dcfce7" stroke="#4ade80" stroke-width="1"/>
  <text x="685" y="141" text-anchor="middle" font-size="10" font-weight="600" fill="#14532d">Planning</text>

  <rect x="602" y="158" width="166" height="30" rx="5" fill="#dcfce7" stroke="#4ade80" stroke-width="1"/>
  <text x="685" y="177" text-anchor="middle" font-size="10" font-weight="600" fill="#14532d">Seek support</text>

  <rect x="602" y="194" width="166" height="30" rx="5" fill="#dcfce7" stroke="#4ade80" stroke-width="1"/>
  <text x="685" y="213" text-anchor="middle" font-size="10" font-weight="600" fill="#14532d">Active confrontation</text>

  <rect x="602" y="230" width="166" height="30" rx="5" fill="#dcfce7" stroke="#4ade80" stroke-width="1"/>
  <text x="685" y="249" text-anchor="middle" font-size="10" font-weight="600" fill="#14532d">Suppression</text>

  <rect x="602" y="266" width="166" height="30" rx="5" fill="#dcfce7" stroke="#4ade80" stroke-width="1"/>
  <text x="685" y="285" text-anchor="middle" font-size="10" font-weight="600" fill="#14532d">Procrastination</text>

  <rect x="602" y="302" width="166" height="30" rx="5" fill="#dcfce7" stroke="#4ade80" stroke-width="1"/>
  <text x="685" y="321" text-anchor="middle" font-size="10" font-weight="600" fill="#14532d">Resignation</text>

  <rect x="602" y="338" width="166" height="30" rx="5" fill="#dcfce7" stroke="#4ade80" stroke-width="1"/>
  <text x="685" y="357" text-anchor="middle" font-size="10" font-weight="600" fill="#14532d">Avoidance</text>

  <!-- Bottom axis label -->
  <text x="107" y="426" text-anchor="middle" font-size="10" fill="#854d0e">Low controllability</text>
  <text x="297" y="426" text-anchor="middle" font-size="10" fill="#991b1b">Low controllability</text>
  <text x="487" y="426" text-anchor="middle" font-size="10" fill="#1d4ed8">Low controllability</text>
  <text x="685" y="426" text-anchor="middle" font-size="10" fill="#166534">High controllability</text>

  <line x1="40" y1="414" x2="760" y2="414" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4"/>
</svg>
