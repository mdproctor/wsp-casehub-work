<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#555"/>
    </marker>
  </defs>

  <!-- BEFORE -->
  <text x="360" y="20" text-anchor="middle" font-size="13" font-weight="bold" fill="#991b1b">Before: keyword matching at consumption time</text>

  <rect x="30" y="36" width="140" height="50" rx="6" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="100" y="58" text-anchor="middle" font-size="10" font-weight="600" fill="#0c4a6e">LLM Extraction</text>
  <text x="100" y="72" text-anchor="middle" font-size="9" fill="#0369a1">key + description</text>

  <line x1="170" y1="61" x2="210" y2="61" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="215" y="36" width="160" height="50" rx="6" fill="#fef9c3" stroke="#facc15" stroke-width="1.2"/>
  <text x="295" y="55" text-anchor="middle" font-size="10" font-weight="600" fill="#713f12">AttributedState</text>
  <text x="295" y="69" text-anchor="middle" font-size="9" fill="#854d0e">no valence signal</text>

  <line x1="375" y1="61" x2="415" y2="61" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="420" y="36" width="160" height="50" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="500" y="55" text-anchor="middle" font-size="10" font-weight="700" fill="#991b1b">isHostile()</text>
  <text x="500" y="69" text-anchor="middle" font-size="9" fill="#b91c1c">substring matching</text>

  <line x1="580" y1="61" x2="620" y2="61" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="625" y="36" width="70" height="50" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
  <text x="660" y="58" text-anchor="middle" font-size="10" font-weight="600" fill="#374151">Trust</text>
  <text x="660" y="72" text-anchor="middle" font-size="9" fill="#6b7280">bias</text>

  <!-- False positive examples -->
  <rect x="420" y="96" width="265" height="52" rx="4" fill="#fff1f2" stroke="#fda4af" stroke-width="0.8"/>
  <text x="430" y="112" font-size="9" fill="#9f1239">✗ "helpless" → matches "help" → cooperative</text>
  <text x="430" y="126" font-size="9" fill="#9f1239">✗ "dominate" → no match → invisible</text>
  <text x="430" y="140" font-size="9" fill="#9f1239">✗ "seize control" → no match → invisible</text>

  <!-- AFTER -->
  <text x="360" y="184" text-anchor="middle" font-size="13" font-weight="bold" fill="#166534">After: LLM resolves valence at extraction time</text>

  <rect x="30" y="200" width="200" height="60" rx="6" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
  <text x="130" y="222" text-anchor="middle" font-size="10" font-weight="600" fill="#166534">LLM Extraction</text>
  <text x="130" y="236" text-anchor="middle" font-size="9" fill="#15803d">key + description + valence</text>
  <text x="130" y="248" text-anchor="middle" font-size="8" fill="#16a34a">hostile | cooperative | neutral</text>

  <line x1="230" y1="230" x2="280" y2="230" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="285" y="200" width="180" height="60" rx="6" fill="#dcfce7" stroke="#22c55e" stroke-width="1.2"/>
  <text x="375" y="222" text-anchor="middle" font-size="10" font-weight="600" fill="#166534">AttributedState</text>
  <text x="375" y="236" text-anchor="middle" font-size="9" fill="#15803d">carries IntentValence</text>
  <text x="375" y="248" text-anchor="middle" font-size="8" fill="#16a34a">semantic signal already resolved</text>

  <line x1="465" y1="230" x2="510" y2="230" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="515" y="200" width="80" height="60" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
  <text x="555" y="222" text-anchor="middle" font-size="10" font-weight="600" fill="#166534">valence</text>
  <text x="555" y="236" text-anchor="middle" font-size="9" fill="#15803d">== HOSTILE?</text>

  <line x1="595" y1="230" x2="625" y2="230" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="630" y="200" width="70" height="60" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1"/>
  <text x="665" y="225" text-anchor="middle" font-size="10" font-weight="600" fill="#374151">Trust</text>
  <text x="665" y="239" text-anchor="middle" font-size="9" fill="#6b7280">bias</text>

  <!-- Correct examples -->
  <rect x="285" y="270" width="310" height="52" rx="4" fill="#f0fdf4" stroke="#86efac" stroke-width="0.8"/>
  <text x="295" y="286" font-size="9" fill="#166534">✓ "helpless" → LLM: neutral → no false positive</text>
  <text x="295" y="300" font-size="9" fill="#166534">✓ "dominate" → LLM: hostile → correctly detected</text>
  <text x="295" y="314" font-size="9" fill="#166534">✓ "build consensus" → LLM: cooperative → no keyword needed</text>

  <!-- Bottom label -->
  <text x="360" y="348" text-anchor="middle" font-size="10" fill="#475569">The LLM resolves semantics once. Downstream code reads the signal mechanically.</text>
</svg>
