<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="system-ui, -apple-system, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#666"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="720" height="420" fill="#fafafa" rx="8"/>

  <!-- Title -->
  <text x="360" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Identity Flow — Before and After W1</text>

  <!-- BEFORE column -->
  <text x="180" y="60" text-anchor="middle" font-size="14" font-weight="bold" fill="#c0392b">Before</text>

  <!-- HTTP caller -->
  <rect x="80" y="80" width="200" height="36" rx="6" fill="#e8e8e8" stroke="#999" stroke-width="1"/>
  <text x="180" y="103" text-anchor="middle" fill="#333">HTTP ?actor=mallory</text>

  <!-- Generated REST -->
  <rect x="80" y="140" width="200" height="36" rx="6" fill="#fadbd8" stroke="#c0392b" stroke-width="1.5"/>
  <text x="180" y="163" text-anchor="middle" fill="#c0392b">Generated REST Resource</text>
  <text x="180" y="176" text-anchor="middle" font-size="10" fill="#c0392b">passes query param through</text>

  <!-- Lifecycle API -->
  <rect x="80" y="200" width="200" height="36" rx="6" fill="#fadbd8" stroke="#c0392b" stroke-width="1.5"/>
  <text x="180" y="223" text-anchor="middle" fill="#c0392b">WorkItemLifecycleApi</text>
  <text x="180" y="236" text-anchor="middle" font-size="10" fill="#c0392b">actor = "mallory" ✗</text>

  <!-- WorkItemOperations -->
  <rect x="80" y="260" width="200" height="36" rx="6" fill="#e8e8e8" stroke="#999" stroke-width="1"/>
  <text x="180" y="283" text-anchor="middle" fill="#333">WorkItemOperations</text>

  <!-- WorkItemService -->
  <rect x="80" y="320" width="200" height="36" rx="6" fill="#e8e8e8" stroke="#999" stroke-width="1"/>
  <text x="180" y="343" text-anchor="middle" fill="#333">WorkItemService</text>

  <!-- Before arrows -->
  <line x1="180" y1="116" x2="180" y2="140" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="180" y1="176" x2="180" y2="200" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="180" y1="236" x2="180" y2="260" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="180" y1="296" x2="180" y2="320" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- AFTER column -->
  <text x="540" y="60" text-anchor="middle" font-size="14" font-weight="bold" fill="#27ae60">After</text>

  <!-- HTTP caller -->
  <rect x="440" y="80" width="200" height="36" rx="6" fill="#e8e8e8" stroke="#999" stroke-width="1"/>
  <text x="540" y="103" text-anchor="middle" fill="#333">HTTP (no actor param)</text>

  <!-- Generated REST -->
  <rect x="440" y="140" width="200" height="36" rx="6" fill="#d5f5e3" stroke="#27ae60" stroke-width="1.5"/>
  <text x="540" y="163" text-anchor="middle" fill="#1e8449">Generated REST Resource</text>
  <text x="540" y="176" text-anchor="middle" font-size="10" fill="#1e8449">no actor query param</text>

  <!-- Lifecycle API + Principal -->
  <rect x="440" y="200" width="200" height="36" rx="6" fill="#d5f5e3" stroke="#27ae60" stroke-width="1.5"/>
  <text x="540" y="223" text-anchor="middle" fill="#1e8449">DefaultLifecycleApi</text>
  <text x="540" y="236" text-anchor="middle" font-size="10" fill="#1e8449">actor = principal.actorId() ✓</text>

  <!-- CurrentPrincipal box -->
  <rect x="660" y="195" width="50" height="46" rx="6" fill="#aed6f1" stroke="#2e86c1" stroke-width="1.5"/>
  <text x="685" y="218" text-anchor="middle" font-size="10" fill="#2e86c1" font-weight="bold">CDI</text>
  <text x="685" y="232" text-anchor="middle" font-size="9" fill="#2e86c1">Principal</text>

  <!-- Arrow from principal to implementation -->
  <line x1="660" y1="218" x2="642" y2="218" stroke="#2e86c1" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- WorkItemOperations -->
  <rect x="440" y="260" width="200" height="36" rx="6" fill="#e8e8e8" stroke="#999" stroke-width="1"/>
  <text x="540" y="283" text-anchor="middle" fill="#333">WorkItemOperations</text>
  <text x="540" y="296" text-anchor="middle" font-size="10" fill="#666">unchanged — still takes actorId</text>

  <!-- WorkItemService -->
  <rect x="440" y="320" width="200" height="36" rx="6" fill="#e8e8e8" stroke="#999" stroke-width="1"/>
  <text x="540" y="343" text-anchor="middle" fill="#333">WorkItemService</text>

  <!-- System caller -->
  <rect x="440" y="370" width="200" height="36" rx="6" fill="#fdebd0" stroke="#e67e22" stroke-width="1"/>
  <text x="540" y="393" text-anchor="middle" fill="#e67e22">Timer / Engine Adapter</text>
  <text x="540" y="406" text-anchor="middle" font-size="10" fill="#e67e22">actor = "system"</text>

  <!-- After arrows -->
  <line x1="540" y1="116" x2="540" y2="140" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="540" y1="176" x2="540" y2="200" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="540" y1="236" x2="540" y2="260" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="540" y1="296" x2="540" y2="320" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- System caller arrow to WorkItemOperations -->
  <line x1="540" y1="370" x2="540" y2="298" stroke="#e67e22" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
</svg>
