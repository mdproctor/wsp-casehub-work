<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="system-ui, -apple-system, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#555"/>
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#3b82f6"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#ef4444"/>
    </marker>
  </defs>

  <rect width="720" height="420" fill="#fafafa" rx="8"/>

  <text x="360" y="28" text-anchor="middle" font-size="16" font-weight="600" fill="#1a1a1a">Elastic Band Personality Model</text>

  <!-- Timeline axis -->
  <line x1="60" y1="350" x2="680" y2="350" stroke="#999" stroke-width="1.5"/>
  <text x="370" y="385" text-anchor="middle" fill="#666" font-size="12">time</text>

  <!-- Y axis -->
  <line x1="60" y1="50" x2="60" y2="350" stroke="#999" stroke-width="1.5"/>
  <text x="25" y="200" text-anchor="middle" fill="#666" font-size="12" transform="rotate(-90, 25, 200)">facet value</text>

  <!-- Baseline -->
  <line x1="60" y1="230" x2="680" y2="230" stroke="#94a3b8" stroke-width="1" stroke-dasharray="6,4"/>
  <text x="55" y="234" text-anchor="end" fill="#94a3b8" font-size="11">baseline (b)</text>

  <!-- Home attractor - starts at baseline, drifts slightly up -->
  <path d="M60,230 L180,230 Q220,228 280,226 Q340,224 400,222 L500,222 Q560,223 620,224 L680,226"
        stroke="#f59e0b" stroke-width="2" fill="none" stroke-dasharray="4,3"/>
  <text x="685" y="222" fill="#f59e0b" font-size="11">home (b+o)</text>

  <!-- Current personality - the elastic band -->
  <path d="M60,230 L180,230 Q200,200 220,140 Q240,100 280,90 Q320,85 360,100 Q400,120 440,160 Q480,195 520,215 Q560,222 600,224 L680,226"
        stroke="#3b82f6" stroke-width="2.5" fill="none"/>
  <text x="685" y="250" fill="#3b82f6" font-size="11">current (c)</text>

  <!-- Stress zone shading -->
  <rect x="180" y="45" width="220" height="300" fill="#ef4444" opacity="0.06" rx="4"/>
  <text x="290" y="62" text-anchor="middle" fill="#ef4444" font-size="11" font-weight="500">stress active</text>

  <!-- Rest zone shading -->
  <rect x="440" y="45" width="240" height="300" fill="#22c55e" opacity="0.04" rx="4"/>
  <text x="560" y="62" text-anchor="middle" fill="#22c55e" font-size="11" font-weight="500">recovery</text>

  <!-- Displacement annotation -->
  <line x1="300" y1="90" x2="300" y2="225" stroke="#ef4444" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="310" y="160" fill="#ef4444" font-size="11">d (displacement)</text>

  <!-- Home offset annotation -->
  <line x1="600" y1="224" x2="600" y2="230" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="610" y="210" fill="#f59e0b" font-size="11">o (lasting offset)</text>

  <!-- Legend -->
  <rect x="80" y="390" width="600" height="24" fill="none"/>
  <text x="85" y="406" fill="#555" font-size="11">Brief stress → returns near baseline  |  Prolonged stress → home drifts  |  Extreme → resilience degrades, slower return</text>
</svg>
