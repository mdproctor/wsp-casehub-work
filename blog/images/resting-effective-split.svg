<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="system-ui, -apple-system, sans-serif" font-size="13">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#555" stroke-width="1.2"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="720" height="420" fill="#fafafa" rx="4"/>

  <!-- Explicit layer -->
  <rect x="30" y="30" width="200" height="80" rx="6" fill="#e8f0fe" stroke="#4285f4" stroke-width="1.5"/>
  <text x="130" y="58" text-anchor="middle" font-weight="600" fill="#1a73e8">Explicit Layer</text>
  <text x="130" y="78" text-anchor="middle" fill="#555" font-size="11">CognitiveDefaultsRegistry</text>
  <text x="130" y="94" text-anchor="middle" fill="#888" font-size="10">classpath YAML • immutable</text>

  <!-- DescriptorViewSource -->
  <rect x="260" y="30" width="200" height="80" rx="6" fill="#fef7e0" stroke="#f9ab00" stroke-width="1.5"/>
  <text x="360" y="58" text-anchor="middle" font-weight="600" fill="#e37400">DescriptorViewSource</text>
  <text x="360" y="78" text-anchor="middle" fill="#555" font-size="11">Eidos AgentRegistry</text>
  <text x="360" y="94" text-anchor="middle" fill="#888" font-size="10">base DescriptorView • per-tenant</text>

  <!-- PersonalityStateSource -->
  <rect x="490" y="30" width="200" height="80" rx="6" fill="#fce8e6" stroke="#ea4335" stroke-width="1.5"/>
  <text x="590" y="58" text-anchor="middle" font-weight="600" fill="#c5221f">PersonalityStateSource</text>
  <text x="590" y="78" text-anchor="middle" fill="#555" font-size="11">SituationalStateService</text>
  <text x="590" y="94" text-anchor="middle" fill="#888" font-size="10">homeOffset + displacement</text>

  <!-- EffectiveCognitiveDefaults -->
  <rect x="160" y="160" width="400" height="90" rx="8" fill="#fff" stroke="#333" stroke-width="2"/>
  <text x="360" y="188" text-anchor="middle" font-weight="700" fill="#222" font-size="15">EffectiveCognitiveDefaults</text>
  <text x="360" y="210" text-anchor="middle" fill="#555" font-size="11">ConcurrentHashMap&lt;(tenantId, agentId), Slot&gt;</text>
  <text x="360" y="228" text-anchor="middle" fill="#555" font-size="11">merge(explicit, derive(base ⊕ state)) • never merge with previous</text>

  <!-- Arrows from sources to ECD -->
  <line x1="130" y1="110" x2="280" y2="160" stroke="#555" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="360" y1="110" x2="360" y2="160" stroke="#555" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="590" y1="110" x2="440" y2="160" stroke="#555" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- Two output paths -->
  <!-- Resting -->
  <rect x="50" y="310" width="280" height="80" rx="6" fill="#e6f4ea" stroke="#34a853" stroke-width="1.5"/>
  <text x="190" y="338" text-anchor="middle" font-weight="600" fill="#1e8e3e">restingFor(tenant, agent)</text>
  <text x="190" y="358" text-anchor="middle" fill="#555" font-size="12">→ LearningProfile</text>
  <text x="190" y="376" text-anchor="middle" fill="#888" font-size="10">base + homeOffset only</text>

  <!-- Effective -->
  <rect x="390" y="310" width="280" height="80" rx="6" fill="#fce8e6" stroke="#ea4335" stroke-width="1.5"/>
  <text x="530" y="338" text-anchor="middle" font-weight="600" fill="#c5221f">forAgent(tenant, agent)</text>
  <text x="530" y="358" text-anchor="middle" fill="#555" font-size="12">→ CognitiveDefaults</text>
  <text x="530" y="376" text-anchor="middle" fill="#888" font-size="10">base + homeOffset + displacement</text>

  <!-- Arrows from ECD to outputs -->
  <line x1="280" y1="250" x2="190" y2="310" stroke="#34a853" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="440" y1="250" x2="530" y2="310" stroke="#ea4335" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Consumer labels -->
  <text x="190" y="406" text-anchor="middle" fill="#1e8e3e" font-size="10" font-style="italic">trust learning, CAPS init, drive adaptation,</text>
  <text x="190" y="418" text-anchor="middle" fill="#1e8e3e" font-size="10" font-style="italic">graduation scoring, strategy learning</text>

  <text x="530" y="406" text-anchor="middle" fill="#c5221f" font-size="10" font-style="italic">appraisal, regulation, search budget,</text>
  <text x="530" y="418" text-anchor="middle" fill="#c5221f" font-size="10" font-style="italic">attention, prompt rendering</text>
</svg>
