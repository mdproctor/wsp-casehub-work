<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#555"/>
    </marker>
  </defs>

  <text x="360" y="24" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">The Semantic Resolution Boundary</text>

  <!-- Unresolved side -->
  <rect x="30" y="50" width="280" height="180" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="6"/>
  <text x="170" y="72" text-anchor="middle" font-size="12" font-weight="700" fill="#991b1b">UNRESOLVED (Semantic)</text>

  <rect x="50" y="88" width="240" height="28" rx="5" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
  <text x="170" y="106" text-anchor="middle" font-size="10" fill="#7f1d1d">"I'm trapped and there's nothing I can do"</text>

  <rect x="50" y="126" width="240" height="28" rx="5" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
  <text x="170" y="144" text-anchor="middle" font-size="10" fill="#7f1d1d">Situation controllability? Requires understanding</text>

  <rect x="50" y="164" width="240" height="28" rx="5" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
  <text x="170" y="182" text-anchor="middle" font-size="10" fill="#7f1d1d">Which coping strategy fits? Context-dependent</text>

  <text x="170" y="218" text-anchor="middle" font-size="11" font-weight="600" fill="#dc2626">LLM does this work</text>

  <!-- Arrow -->
  <line x1="315" y1="140" x2="395" y2="140" stroke="#555" stroke-width="2" marker-end="url(#arr)"/>
  <text x="355" y="132" text-anchor="middle" font-size="10" font-weight="600" fill="#334155">resolves to</text>

  <!-- Resolved side -->
  <rect x="400" y="50" width="290" height="180" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <text x="545" y="72" text-anchor="middle" font-size="12" font-weight="700" fill="#166534">RESOLVED (Numeric)</text>

  <rect x="420" y="88" width="250" height="28" rx="5" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
  <text x="545" y="106" text-anchor="middle" font-size="10" fill="#14532d">controllability: 0.2, adjustability: 0.4</text>

  <rect x="420" y="126" width="250" height="28" rx="5" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
  <text x="545" y="144" text-anchor="middle" font-size="10" fill="#14532d">planfulTendency: 0.8, avoidanceTendency: 0.3</text>

  <rect x="420" y="164" width="250" height="28" rx="5" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
  <text x="545" y="182" text-anchor="middle" font-size="10" fill="#14532d">Personality bias: conscientiousness → planning</text>

  <text x="545" y="218" text-anchor="middle" font-size="11" font-weight="600" fill="#16a34a">Mechanical computation does this</text>

  <!-- Bottom summary -->
  <text x="360" y="260" text-anchor="middle" font-size="11" fill="#475569">Keyword matching sits on the wrong side. It pretends to be mechanical but operates on unresolved text.</text>
</svg>
